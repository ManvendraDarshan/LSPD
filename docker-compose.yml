services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lspd
      POSTGRES_USER: lspd
      POSTGRES_PASSWORD: lspd
    ports:
      - "5432:5432"
    volumes:
      - lspd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lspd -d lspd"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lspd:lspd@db:5432/lspd
      FRONTEND_URL: http://localhost:5173
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python /seed/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  lspd_pgdata:
